name: Release

# ─────────────────────────────────────────────────────────────────────────────
# 触发方式
#   1) 向 main 分支提交以 "release x.x.x.x" 开头的提交：
#        release 0.3.0.0          → 正式版
#        release 0.3.0.0-beta     → 预发布版（pre-release）
#      提交信息里带了后缀（beta / alpha / rc / preview …）即视为预发布。
#   2) Actions 页面手动触发（workflow_dispatch）：用于重跑或先试跑一遍。
#      注意 tag 只取数字版本号（0.3.0.0），后缀只用于标记 pre-release，
#      所以同一数字版本的 beta 与正式版不能共存，正式版发布前请先删掉 beta 的 Release。
#
# 流程
#   prepare → 解析版本号，在 CHANGELOG/ 里找对应变更日志作为 Release Notes
#   desktop → Windows / Linux / macOS 三个原生 runner，用 Fallout 打包安装包
#   android → APK（配置了密钥库 Secrets 则签名）
#   ios     → 配了证书 Secrets 就签名并出 IPA；没配则退化为构建模拟器版 .app
#             （仅验证能编译，不能装真机、不进 Release，不能让没证书的人卡死发版）
#   release → 汇总全部产物，创建【草稿】Release（需要你手动点 Publish）
#
# 需要的仓库 Secrets / Variables（Settings → Secrets and variables → Actions）
#   Secrets（可选，不配也能跑，但产物是未签名/模拟器版）：
#     ANDROID_KEYSTORE_BASE64        release.keystore 的 base64
#     ANDROID_KEYSTORE_PASSWORD      密钥库口令
#     ANDROID_KEY_ALIAS              密钥别名
#     ANDROID_KEY_PASSWORD           密钥口令
#     IOS_CERTIFICATE_BASE64         Apple 发布证书 .p12 的 base64
#     IOS_CERTIFICATE_PASSWORD       .p12 口令
#     IOS_CERTIFICATE_NAME           （可选）证书名称，缺省时自动取导入后的签名身份
#     IOS_PROVISIONING_PROFILE_BASE64  描述文件 .mobileprovision 的 base64
#   Variables（可选）：
#     ANDROID_APPLICATION_ID         覆盖 Android ApplicationId
#     IOS_BUNDLE_ID                  覆盖 iOS Bundle ID（必须与描述文件的 App ID 一致，
#                                    不一致时会提前报错并告诉你该填什么）
#
#   生成 base64：base64 -w0 release.keystore        （macOS 用 base64 -i）
# ─────────────────────────────────────────────────────────────────────────────

# test at Sept. 27th 2026

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例：0.3.0.0 或 0.3.0.0-beta）'
        required: true
        type: string
      prerelease:
        description: '标记为 pre-release（填了 -beta 这类后缀时会自动勾选）'
        required: false
        type: boolean
        default: false
      create_release:
        description: '构建完成后创建草稿 Release（取消勾选则只构建、只上传 Actions 产物）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

defaults:
  run:
    shell: bash

jobs:
  # ─────────────────────────── 解析版本 / 提取变更日志 ───────────────────────────
  prepare:
    name: 解析版本与 CHANGELOG
    # 非 release 提交直接跳过，不会在 Actions 里留下失败记录
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.parse.outputs.should_release }}
      create_release: ${{ steps.parse.outputs.create_release }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      title: ${{ steps.parse.outputs.title }}
      changelog_file: ${{ steps.changelog.outputs.file }}
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析提交信息中的版本号
        id: parse
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          set -euo pipefail

          # 解析失败时：push 触发只警告不阻断开发流程；手动触发直接报错
          fail() {
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            raw="$(printf '%s' "${INPUT_VERSION:-}" | tr -d '[:space:]')"
            if [ -z "$raw" ]; then
              fail "手动触发必须填写版本号"
            fi
          else
            first_line="$(printf '%s\n' "${COMMIT_MESSAGE:-}" | head -n 1 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ ! "$first_line" =~ ^release[[:space:]]+(.+)$ ]]; then
              fail "提交信息 '${first_line}' 不是发布提交（应以 'release x.x.x.x' 开头），本次不发布"
            fi
            raw="${BASH_REMATCH[1]}"
          fi

          # 接受 0.3.0.0 / 0.3.0.0-beta / 0.3.0.0 beta / 0.3.0.0-beta.1
          if [[ ! "$raw" =~ ^([0-9]+(\.[0-9]+){1,3})([-_. ]?([A-Za-z][A-Za-z0-9._-]*))?$ ]]; then
            fail "无法识别的版本号 '${raw}'，应形如 x.x.x.x 或 x.x.x.x-beta，本次不发布"
          fi
          numeric="${BASH_REMATCH[1]}"
          suffix="${BASH_REMATCH[4]:-}"

          prerelease=false
          if [ -n "$suffix" ]; then
            prerelease=true
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_PRERELEASE:-}" = "true" ]; then
            prerelease=true
          fi

          create_release=true
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_CREATE_RELEASE:-}" = "false" ]; then
            create_release=false
          fi

          # tag 只用数字版本号；后缀（beta）体现在标题与 pre-release 标记里
          title="ImmersingHomework ${numeric}"
          if [ -n "$suffix" ]; then
            title="${title} (${suffix})"
          fi

          {
            echo "should_release=true"
            echo "create_release=${create_release}"
            echo "version=${numeric}"
            echo "written=${raw}"
            echo "suffix=${suffix}"
            echo "tag=${numeric}"
            echo "prerelease=${prerelease}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"

          echo "版本号：${numeric}｜后缀：${suffix:-无}｜预发布：${prerelease}｜tag：${numeric}"

      - name: 校验各工程版本号是否与发布版本一致
        if: steps.parse.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          for f in \
            ImmersingHomework/ImmersingHomework.csproj \
            ImmersingHomework.Launcher/ImmersingHomework.Launcher.csproj \
            ImmersingHomework.Shared/ImmersingHomework.Shared.csproj \
            ImmersingHomework.Mobile/ImmersingHomework.Mobile/ImmersingHomework.Mobile.csproj
          do
            [ -f "$f" ] || continue
            v="$(sed -n 's/.*<AssemblyVersion>\([^<]*\)<\/AssemblyVersion>.*/\1/p' "$f" | head -n 1)"
            if [ -z "$v" ]; then
              echo "::warning file=$f::未找到 <AssemblyVersion>"
            elif [ "$v" != "$VERSION" ]; then
              echo "::warning file=$f::AssemblyVersion=$v 与发布版本 $VERSION 不一致，产物的版本信息仍会是 $v"
            fi
          done

      - name: 从 CHANGELOG 提取本版本更新内容
        id: changelog
        if: steps.parse.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          WRITTEN: ${{ steps.parse.outputs.written }}
          SUFFIX: ${{ steps.parse.outputs.suffix }}
          PRERELEASE: ${{ steps.parse.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          file=""
          # 1) 提交里写的完整版本号：CHANGELOG/0.3.0.0-beta.md
          # 2) 纯数字版本号：CHANGELOG/0.3.0.0.md
          for cand in "CHANGELOG/${WRITTEN:-}.md" "CHANGELOG/${VERSION:-}.md"; do
            if [ -f "$cand" ]; then
              file="$cand"
              break
            fi
          done

          # 3) 通配匹配：CHANGELOG/*0.3.0.0*.md
          if [ -z "$file" ]; then
            matches=(CHANGELOG/*"${VERSION}"*.md)
            if [ "${#matches[@]}" -eq 1 ]; then
              file="${matches[0]}"
            elif [ "${#matches[@]}" -gt 1 ]; then
              if [ -n "${SUFFIX:-}" ]; then
                for m in "${matches[@]}"; do
                  case "$m" in
                    *"$SUFFIX"*) file="$m"; break ;;
                  esac
                done
              fi
              if [ -z "$file" ]; then
                echo "::error::CHANGELOG 中有多个文件匹配版本 $VERSION，请把本版本日志命名为 CHANGELOG/${VERSION}.md 后重试："
                printf '  %s\n' "${matches[@]}"
                exit 1
              fi
            fi
          fi

          # 4) 兜底：根目录 CHANGELOG.md 中的 "## [0.3.0.0]" / "## 0.3.0.0" 小节
          if [ -z "$file" ] && [ -f CHANGELOG.md ]; then
            section="$(mktemp)"
            awk -v ver="$VERSION" '
              $0 ~ "^#+[[:space:]]*\\[?" ver "\\]?([[:space:]]|$)" { found = 1; next }
              found && /^#+[[:space:]]/ { exit }
              found { print }
            ' CHANGELOG.md > "$section"
            if [ -s "$section" ]; then
              file="$section"
            fi
          fi

          if [ -z "$file" ]; then
            echo "::error::没有找到 ${VERSION} 的变更日志，请先添加 CHANGELOG/${VERSION}.md（其内容将作为 Release Notes）"
            exit 1
          fi

          notes="$(mktemp)"
          if [ "${PRERELEASE:-}" = "true" ]; then
            {
              echo "> ⚠️ 这是一个**预发布版本**，可能包含未稳定的改动。"
              echo
              cat "$file"
            } > "$notes"
          else
            cp "$file" "$notes"
          fi

          {
            echo "file=${file}"
            echo "notes<<__IH_RELEASE_NOTES_EOF__"
            cat "$notes"
            echo
            echo "__IH_RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "变更日志来源：$file"

  # ───────────────────────────────── 桌面端 ─────────────────────────────────
  desktop:
    name: 桌面端 ${{ matrix.rid }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            packaging: Portable DotNetSingleFile WindowsInstaller
          - os: ubuntu-latest
            rid: linux-x64
            packaging: Portable DotNetSingleFile LinuxDeb LinuxRpm LinuxAppImage
          - os: macos-latest
            rid: osx-arm64
            packaging: Portable DotNetSingleFile MacOSAppBundle MacOSDmg MacOSPkg
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot zip

      # Fallout 靠仓库根目录下的 .fallout 目录来推断根目录，而 .fallout 在
      # .gitignore 里、CI 全新 checkout 中并不存在，缺失时会直接抛
      # "Could not locate '.fallout' directory/file" 而失败，这里先补上这个标记。
      - name: 补上 Fallout 根目录标记
        run: mkdir -p .fallout

      # 用 dotnet run 直接跑 build/_build.csproj，无需依赖 .config/dotnet-tools.json
      # 里 pin 的 fallout 全局工具版本（该版本未必能在 NuGet 上还原）。
      - name: 发布（含安装包）
        id: publish
        continue-on-error: true
        run: |
          set -euo pipefail
          read -r -a packaging <<< "${{ matrix.packaging }}"
          dotnet run --project build/_build.csproj -c Release -- \
            Publish --no-logo \
            --configuration Release \
            --rids "$RID" \
            --packaging-types "${packaging[@]}"

      # 安装包生成失败（如 WiX / dmg 工具链问题）时不整单失败，退回便携包
      - name: 回退为便携包
        if: steps.publish.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning title=安装包生成失败::已回退为 Portable + DotNetSingleFile，仅发布便携包与单文件版本"
          rm -rf artifacts/publish
          mkdir -p .fallout
          dotnet run --project build/_build.csproj -c Release -- \
            Publish --no-logo \
            --configuration Release \
            --rids "$RID" \
            --packaging-types Portable DotNetSingleFile

      - name: 整理产物
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          root="$PWD"

          # 优先 zip 命令，其次 python3，避免 runner 上没有 zip
          pack_zip() {
            local src="$1" out="$2"
            rm -f "$out"
            if command -v zip > /dev/null 2>&1; then
              (cd "$src" && zip -qr "$out" .)
            elif command -v python3 > /dev/null 2>&1; then
              python3 -c "import shutil, sys; shutil.make_archive(sys.argv[2][:-4], 'zip', sys.argv[1])" "$src" "$out"
            else
              echo "::error::打包 zip 需要 zip 或 python3 命令"
              exit 1
            fi
          }

          # 便携包：若 Fallout 已产出本平台的压缩包就直接收集，否则压缩原始发布目录
          archives=(artifacts/publish/*"$RID"*.zip artifacts/publish/*"$RID"*.tar.gz)
          if [ "${#archives[@]}" -eq 0 ]; then
            for dir in artifacts/publish/*"$RID"_v*; do
              if [ -d "$dir" ]; then
                name="ImmersingHomework-${VERSION}-${RID}.zip"
                echo "压缩便携包：$dir -> dist/$name"
                if [ "$RUNNER_OS" = "Windows" ]; then
                  powershell -NoProfile -Command \
                    "Compress-Archive -Path '$(cygpath -w "$dir")\*' -DestinationPath '$(cygpath -w "$root/dist/$name")' -Force"
                else
                  pack_zip "$dir" "$root/dist/$name"
                fi
              fi
            done
          fi

          # 安装包 / 单文件可执行文件等顶层产物
          for f in artifacts/publish/*; do
            if [ -f "$f" ]; then
              cp -v "$f" dist/
            fi
          done

          if [ -z "$(ls -A dist)" ]; then
            echo "::error::没有收集到任何产物"
            exit 1
          fi

          echo "===== 产物清单 ====="
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────── Android APK ───────────────────────────────
  android:
    name: 移动端 Android（APK）
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 安装 Android workload
        run: dotnet workload install android

      - name: 发布 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
        run: |
          set -euo pipefail

          # versionCode：由 x.x.x.x 推导，保证随版本号单调递增
          IFS=. read -r v1 v2 v3 v4 <<< "$VERSION"
          code=$(( ${v1:-0} * 1000000 + ${v2:-0} * 10000 + ${v3:-0} * 100 + ${v4:-0} ))
          echo "ApplicationVersion(versionCode) = $code"

          args=(
            publish ImmersingHomework.Mobile/ImmersingHomework.Mobile.Android/ImmersingHomework.Mobile.Android.csproj
            -c Release
            -f net10.0-android
            -p:ApplicationDisplayVersion="$VERSION"
            -p:ApplicationVersion="$code"
          )
          if [ -n "${ANDROID_APPLICATION_ID:-}" ]; then
            args+=(-p:ApplicationId="$ANDROID_APPLICATION_ID")
          fi

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "使用 Secrets 中的密钥库对 APK 签名"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            args+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
            )
          else
            echo "::warning title=APK 未签名::未配置 ANDROID_KEYSTORE_BASE64 等 Secrets，产物为未签名 APK，不能直接安装"
          fi

          dotnet "${args[@]}"

      - name: 整理产物
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          base="ImmersingHomework.Mobile/ImmersingHomework.Mobile.Android/bin/Release/net10.0-android"
          apks=("$base"/publish/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            apks=("$base"/*.apk)
          fi
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::没有找到 APK 产物"
            exit 1
          fi
          src="${apks[0]}"
          for a in "${apks[@]}"; do
            case "$a" in
              *-Signed.apk) src="$a" ;;
            esac
          done
          cp "$src" "dist/ImmersingHomework-Mobile-${VERSION}-android.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ──────────────────────────────── iOS IPA ────────────────────────────────
  ios:
    name: 移动端 iOS（IPA）
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 安装 iOS workload
        run: dotnet workload install ios

      - name: 构建 iOS 应用
        id: build
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_CERTIFICATE_NAME: ${{ secrets.IOS_CERTIFICATE_NAME }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail

          IFS=. read -r v1 v2 v3 v4 <<< "$VERSION"
          code=$(( ${v1:-0} * 1000000 + ${v2:-0} * 10000 + ${v3:-0} * 100 + ${v4:-0} ))
          echo "CFBundleVersion = $code"

          info_plist="ImmersingHomework.Mobile/ImmersingHomework.Mobile.iOS/Info.plist"

          args=(
            publish ImmersingHomework.Mobile/ImmersingHomework.Mobile.iOS/ImmersingHomework.Mobile.iOS.csproj
            -c Release
            -f net10.0-ios
            -p:ApplicationDisplayVersion="$VERSION"
            -p:ApplicationVersion="$code"
          )
          if [ -n "${IOS_BUNDLE_ID:-}" ]; then
            args+=(-p:ApplicationId="$IOS_BUNDLE_ID")
          fi

          if [ -n "${IOS_CERTIFICATE_BASE64:-}" ] && [ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"

            echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"

            keychain="$RUNNER_TEMP/ih-signing.keychain-db"
            keychain_password="$(openssl rand -hex 16)"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "${IOS_CERTIFICATE_PASSWORD:-}" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
            # shellcheck disable=SC2046
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

            profile_uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)"
            profile_name="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -o - -)"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

            if [ -n "${IOS_CERTIFICATE_NAME:-}" ]; then
              cert_name="$IOS_CERTIFICATE_NAME"
            else
              cert_name="$(security find-identity -v -p codesigning "$keychain" | awk '/"/{print $2; exit}')"
            fi
            if [ -z "$cert_name" ]; then
              echo "::error::导入的证书里没有可用的代码签名身份，请检查 IOS_CERTIFICATE_BASE64 / IOS_CERTIFICATE_PASSWORD"
              exit 1
            fi

            # 提前核对「描述文件的 App ID」与「最终 Bundle ID」，否则会在 codesign
            # 阶段抛一句很难懂的 profile 不匹配错误。
            profile_app_id="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Entitlements.application-identifier raw -o - - 2> /dev/null || true)"
            profile_bundle="${profile_app_id#*.}"
            effective_bundle="${IOS_BUNDLE_ID:-}"
            if [ -z "$effective_bundle" ]; then
              effective_bundle="$(plutil -extract CFBundleIdentifier raw -o - "$info_plist" 2> /dev/null || true)"
            fi
            if [ -z "$effective_bundle" ]; then
              echo "::warning title=iOS Bundle ID::既没有设置仓库变量 IOS_BUNDLE_ID，也没能从 Info.plist 读到 CFBundleIdentifier，跳过 App ID 一致性检查"
            elif [ -n "$profile_bundle" ] && [ "$profile_bundle" != "*" ] && [ "$profile_bundle" != "$effective_bundle" ]; then
              echo "::error::描述文件对应的 App ID 是 '${profile_app_id}'，而当前 Bundle ID 是 '${effective_bundle}'，两者必须一致。请在仓库 Variables 里把 IOS_BUNDLE_ID 设为 '${profile_bundle}'（或改 Info.plist 的 CFBundleIdentifier）后重跑。"
              exit 1
            fi

            echo "签名身份：$cert_name｜描述文件：$profile_name｜Bundle ID：$effective_bundle"
            args+=(
              -p:RuntimeIdentifier=ios-arm64
              -p:CodesignKey="$cert_name"
              -p:CodesignProvision="$profile_name"
              -p:CodesignKeychain="$keychain"
              -p:BuildIpa=true
            )
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"

            # 真机（ios-arm64）构建在 .NET iOS 里强制要求签名身份，没有证书时根本出不了
            # IPA（用空 CodesignKey 只会让 SDK 去钥匙串里找任意证书然后报错）。所以这里
            # 退一步：构建模拟器版 .app，仅用于验证 iOS 代码能编译通过。该产物不能装到
            # 真机，也不会进 Release；配好证书 Secrets 后重跑即可产出签名 IPA。
            sim_rid="iossimulator-x64"
            if [ "$(uname -m)" = "arm64" ]; then
              sim_rid="iossimulator-arm64"
            fi
            args+=(
              -p:RuntimeIdentifier="$sim_rid"
              -p:EnableCodeSigning=false
              -p:CodesignRequireProvisioningProfile=false
              -p:EnableDefaultCodesignEntitlements=false
              -p:BuildIpa=false
            )
            echo "::warning title=iOS 未签名::未配置 IOS_CERTIFICATE_BASE64 / IOS_PROVISIONING_PROFILE_BASE64，本次只构建模拟器版 .app（不能装真机、不进 Release）。配好证书 Secrets 后重跑即可产出签名 IPA。"
          fi

          dotnet "${args[@]}"

      - name: 整理产物
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          base="ImmersingHomework.Mobile/ImmersingHomework.Mobile.iOS/bin/Release/net10.0-ios"

          ipas=("$base"/*/publish/*.ipa "$base"/*/*.ipa)
          if [ "${#ipas[@]}" -gt 0 ]; then
            cp "${ipas[0]}" "dist/ImmersingHomework-Mobile-${VERSION}-ios.ipa"
          else
            apps=("$base"/*/publish/*.app "$base"/*/*.app)
            if [ "${#apps[@]}" -eq 0 ]; then
              echo "::error::没有找到 .ipa / .app 产物"
              exit 1
            fi
            case "${apps[0]}" in
              *simulator*) name="ImmersingHomework-Mobile-${VERSION}-ios-simulator-unsigned.zip" ;;
              *) name="ImmersingHomework-Mobile-${VERSION}-ios-unsigned.zip" ;;
            esac
            zip -qry "dist/$name" "${apps[0]}"
          fi
          ls -lh dist

      # 签名成功 → 这个 IPA 才算发布产物
      - name: 上传 iOS 产物（进 Release）
        if: steps.build.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-mobile-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # 未签名 → 只留作本次运行的排查产物，不混进 Release
      - name: 上传 iOS 冒烟产物（不进 Release）
        if: steps.build.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-smoke
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────── 汇总并创建草稿 Release ───────────────────────────
  release:
    name: 创建草稿 Release
    needs: [prepare, desktop, android, ios]
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      TITLE: ${{ needs.prepare.outputs.title }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      NOTES: ${{ needs.prepare.outputs.notes }}
      CHANGELOG_FILE: ${{ needs.prepare.outputs.changelog_file }}
    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建草稿 Release 并上传产物
        run: |
          set -euo pipefail
          shopt -s nullglob

          printf '%s\n' "$NOTES" > release-notes.md
          echo "===== Release Notes ====="
          cat release-notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft -q '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "::error::tag $TAG 对应的 Release 已经发布过了。tag 只含数字版本号，若要发布同一数字版本的正式版，请先删除旧的 Release，或改用更高的版本号。"
              exit 1
            fi
            echo "已存在同名草稿 Release，更新其内容"
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --prerelease
            fi
          else
            create_args=(release create "$TAG" --draft --title "$TITLE" --notes-file release-notes.md --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}"
          fi

          # 未签名的 iOS 冒烟包不进 Release（只在本次运行的 Artifacts 里保留）
          files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              *-ios-simulator-unsigned.zip | *-ios-unsigned.zip) echo "跳过（未签名，不进 Release）：$f"; continue ;;
            esac
            files+=("$f")
          done < <(find dist -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::没有可上传的产物"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

          url="$(gh release view "$TAG" --json url -q '.url')"
          echo "草稿 Release：$url"

          {
            echo "## 草稿 Release 已就绪"
            echo
            echo "- **tag**：\`$TAG\`（发布时自动创建）"
            echo "- **标题**：$TITLE"
            echo "- **预发布**：\`$PRERELEASE\`"
            echo "- **变更日志**：\`${CHANGELOG_FILE:-未知}\`"
            echo
            echo "### 已上传产物"
            echo
            echo '```'
            ls -lh dist
            echo '```'
            echo
            echo "👉 到 Releases 页面点击 **Publish release** 才会真正发布（并创建 tag）。"
          } >> "$GITHUB_STEP_SUMMARY"
